<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
  <link rel="stylesheet" href="/proyecto de verdad/CSS/registro.css">  
</head>
<body>
  
  <header>
        <nav>
            <a href="/proyecto de verdad/index.html"><img src="/proyecto de verdad/images/logo.jpg" id="logo" alt="Logo" ></a></a>
            <div>
                <a href="/proyecto de verdad/index/registro.html">Registro</a>
                <a href="/proyecto de verdad/index/contact.html">Contacto</a>
                <a href="/proyecto de verdad/index/cart.html" id="cart"><img src="/proyecto de verdad/images/carritoley.png" alt="crrito de compras"><span id="cuenta-carrito">0</span></a>
            </div>
        </nav>
    </header>
  
  <div class="container">

    <div class="form-container">
      <h1>Registro</h1>
      <!-- boton de Nombre de usuario -->
        <form>
          <div class="intup-group">
            <div class="input-field">
              <i class="fas fa-user"></i>
              <input type="text" id="Nombre" placeholder="Nombre de usuario">
            </div>
            <span class="error-message"></span>
          </div>
          
          <!-- boton de correo electronico -->
          <div class="intup-group">
            <div class="input-field">
              <i class="fas fa-user"></i>
              <input type="email" id="correo" placeholder="Correo electronico">
            </div>
            <span class="error-message"></span>
          </div>
          
          <!-- boton de contraseña -->
          <div class="intup-group">
            <div class="input-field">
              <i class="fas fa-user"></i>
              <input type="password" id="contrasena" placeholder="Contraseña">
            </div>
            <span class="error-message"></span>
          </div>
          
          <!-- botones de registro y inicio de sesión -->
          <div class="btn-field">
            <button id="registrarse" type="button">Registrarse</button>
            <button id="iniciar-sesion" type="button">Iniciar sesión</button>
          </div>
        </form>
    </div>
  </div>
  <script src="../JS/registro.js"></script>
</body>
</html>
