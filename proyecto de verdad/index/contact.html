<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="/proyecto de verdad/CSS/contact.css">
</head>
<body>
<header>
        <nav>
            <a href="index.html"><img src="/proyecto de verdad/images/logo.jpg" id="logo" alt="Logo" ></a></a>
            <div>
                <a href="/proyecto de verdad/index/registro.html">Registro</a>
                <a href="/proyecto de verdad/index/contact.html">Contacto</a>
                <a href="/proyecto de verdad/index/cart.html" id="cart"><img src="/proyecto de verdad/images/carritoley.png" alt="crrito de compras"><span id="cuenta-carrito">0</span></a>
            </div>
        </nav>
    </header>


  <div class="contact-card">
    <h2>Contacto al soporte</h2>

    <div class="Nombre-del-usuario">
      <label for="nombre" class="sr-only">Nombre del usuario</label>
      <input id="nombre" type="text" placeholder="Nombre del usuario">
    </div>

    <div class="Correo-electronico">
      <label for="correo" class="sr-only">Correo electrónico</label>
      <input id="correo" type="email" placeholder="Correo electrónico">
    </div>

    <div class="mensaje">
      <label for="mensaje" class="sr-only">Mensaje</label>
      <textarea id="mensaje" placeholder="Escribe tu mensaje aquí" rows="6"></textarea>
    </div>

    <div class="boton-enviar">
      <input id="enviar" type="button" value="Enviar">
    </div>
  </div>

<script src="proyecto de verdad/JS/contact.js"></script>
</body>
</html>
